# {{project}}: processes for the machine's process manager (process-compose; namespace {{project}}).
# Placeholders resolved by mm at start: {root} project folder, {home} $HOME, {project} this id, {socket} Dolt socket,
# {url:<service>} another service's URL. HTTP services get PORT from portless (name: <service>.{project}.localhost).
version: 1
services:
  dolt:
    about: Dolt SQL server with the Beads database. Clients use the Unix socket; the TCP port is loopback-only.
    # bin/dolt-run clears a socket file nothing answers on (a dead Dolt, or one from the other side of a box move)
    command: "node {root}/bin/dolt-run {socket} {root}/tools/dolt sql-server --host 127.0.0.1 --port {dolt_port} --socket {socket} --loglevel warning"
    workdir: "{root}/control/.beads/dolt"
    env: { DOLT_ROOT_PATH: "{root}/.dolt-root", XDG_CONFIG_HOME: "{root}/.config" }
    port: internal
    # ready once it answers a query (bin/dolt-ready), not when the socket file appears: bd-serve waits for that
    ready: { socket: "{socket}", exec: "node {root}/bin/dolt-ready {socket}" }
    restart: on_failure
  bd-serve:
    about: Beads HTTP API and event stream (board and wake read it).
    command: "{root}/bin/bd serve --addr 127.0.0.1:$PORT --actor ui --allowed-host bd-serve.{project}.localhost"
    workdir: "{root}/control"
    env: { BEADS_DOLT_SERVER_SOCKET: "{socket}" }
    port: http
    depends_on: { dolt: ready }
    ready: { http: /healthz }
    restart: always
  board:
    about: The work board (web UI + API proxy).
    command: "node {root}/site/server.mjs"
    env: { HOST: 127.0.0.1, BD_SERVE: "{url:bd-serve}", MERMAN_BIN: merman-cli }
    port: http
    public: { name: "board-{{name}}-{{client}}", auth: required }
    depends_on: { bd-serve: ready }
    ready: { http: /api/whoami }
    restart: always
  wake:
    about: Wakes a role's lead (Paseo agent) when its board items change.
    command: "node {root}/bin/wake"
    env: { BD_SERVE: "{url:bd-serve}" }
    port: none
    depends_on: { bd-serve: ready }
    restart: always
  app:
    about: Optional app slot, served from release/ (moved only by bin/deploy). Starts once release/ exists.
    optional: true
    # the release's start command (package.json "mm": {"app": {"command": ...}}, default `node server.js`; bin/app-run)
    command: "HOST=$${MM_BIND:-$$HOST} exec {root}/bin/app-run"   # loopback (portless); mm forwards a public app from the machine's bind_host
    workdir: "{root}/release"
    env: { HOST: 127.0.0.1, DATA_DIR: "{root}/data/app" }   # DATA_DIR: the app's data outside release/ (in the daily backup)
    port: http
    public: { name: "{{name}}-{{client}}", auth: none }
    ready: { http: / }
    restart: always
  doop:
    about: "Optional design canvas (Doop, the pinned image mm names in .run/endpoints.json): its data in data/doop/, its own account and agent key in secrets/. The design lead reaches it by MCP on loopback; people open it at its public name behind the sign-in gateway (the mm fork checks the gateway's assertion: no second login; box/doop/). On with `mm doop on <project>` (plans/doop.md)."
    optional: true
    command: "{root}/bin/doop-run"
    env: { DOOP_URL: "{url:doop}" }
    port: http
    public: { name: "doop-{{name}}-{{client}}", auth: required }   # names: project -> doop.<project>
    ready: { http: /healthz }
    restart: always
    stop_seconds: 30   # its database closes, then it regroups its files (bin/doop-run): more than the default 10s
schedules:
  health: { every: 1m, command: "node {root}/bin/health" }
  backup: { every: "daily 03:30", command: "{root}/bin/backup" }
  flow: { every: 5m, command: "node {root}/bin/flow" }   # the board's events -> one trace per item + flow metrics (mm obs flow)
