# system: the machine's own board (namespace system). Loopback only: reach it over an SSH tunnel (`svc ls`).
# Placeholders resolved by mm at start: {root} {home} {project} {socket} {dolt_port} {url:<service>}.
version: 1
services:
  dolt:
    about: Dolt SQL server with the system board's database. Clients use the Unix socket; the TCP port is loopback-only.
    command: "{root}/tools/dolt sql-server --host 127.0.0.1 --port {dolt_port} --socket {socket} --loglevel warning"
    workdir: "{root}/control/.beads/dolt"
    env: { DOLT_ROOT_PATH: "{root}/.dolt-root", XDG_CONFIG_HOME: "{root}/.config" }
    port: internal
    ready: { socket: "{socket}" }
    restart: on_failure
  bd-serve:
    about: Beads HTTP API and event stream (board and wake read it).
    command: "{root}/bin/bd serve --addr 127.0.0.1:$PORT --actor ui --allowed-host bd-serve.{project}.localhost"
    workdir: "{root}/control"
    env: { BEADS_DOLT_SERVER_SOCKET: "{socket}" }
    port: http
    depends_on: { dolt: ready }
    ready: { http: /healthz }
    restart: always
  board:
    about: The system board (web UI + API proxy). Not public.
    command: "node {root}/site/server.mjs"
    env: { HOST: 127.0.0.1, BD_SERVE: "{url:bd-serve}", MERMAN_BIN: merman-cli, BOARD_PANELS: machine }   # the machine panel (template site)
    port: http
    depends_on: { bd-serve: ready }
    ready: { http: /api/whoami }
    restart: always
  wake:
    about: Wakes a role's lead (Paseo agent) when its board items change.
    command: "node {root}/bin/wake"
    env: { BD_SERVE: "{url:bd-serve}" }
    port: none
    depends_on: { bd-serve: ready }
    restart: always
  doop:
    about: "Optional design canvas for the boards' own design (Doop, as a project's: bin/doop-run, the pinned image mm names in .run/endpoints.json): its data in data/doop/ (in the backup), its own account and agent key in secrets/. The platform lead reaches it by MCP on loopback; the owner opens it at doop-<board>.<domain> behind the sign-in gateway (owner only: nobody else holds a role on this board). Off by default; on with `mm doop on <board>`."
    optional: true
    command: "{root}/bin/doop-run"
    env: { DOOP_URL: "{url:doop}" }
    port: http
    public: { name: "doop-{project}", auth: required }   # the system board keeps its own names: doop-<board>
    ready: { http: /healthz }
    restart: always
    stop_seconds: 30   # its database closes, then it regroups its files (bin/doop-run): more than the default 10s
schedules:
  health: { every: 1m, command: "node {root}/bin/health" }
  backup: { every: "daily 03:40", command: "{root}/bin/backup" }
  sentinel: { every: 5m, command: "node {root}/bin/sentinel" }   # machine + project problems -> incident items for ops
  supervisor: { every: 5m, command: "node {root}/bin/supervisor" }   # stalls, waiting handoffs, idle leads (one digest per role), stale worktrees -> items for ops
  upstream: { every: 2m, command: "node {root}/bin/upstream" }   # project items labelled upstream:engine|machine -> items here; answers go back
  flow: { every: 5m, command: "node {root}/bin/flow" }   # the board's events -> one trace per item + flow metrics (mm obs flow)
